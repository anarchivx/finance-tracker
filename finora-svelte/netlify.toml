# Konfigurasi Build Netlify untuk Finora SvelteKit
[build]
  command = "npm run build"
  publish = ".svelte-kit/output/client"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
